services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks: [frontend]
    restart: unless-stopped

  api:
    image: ${API_IMAGE:-url-api:local}
    build: ./api
    env_file: .env
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 256m
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [frontend, backend, monitoring]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    networks: [backend]
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]
    restart: unless-stopped

networks:
  frontend:
  backend:
    internal: true
  monitoring:

volumes:
  pgdata:
  grafana-data:
