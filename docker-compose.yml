services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks: [frontend]
    restart: unless-stopped

  api:
    image: ${API_IMAGE:-url-api:local}
    build: ./api
    env_file: .env
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 256m
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [frontend, backend, monitoring]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    networks: [backend]
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - '127.0.0.1:9090:9090'
    networks: [monitoring]
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [monitoring]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - '3000:3000'
    networks: [monitoring]
    restart: unless-stopped

networks:
  frontend:
  backend:
    internal: true
  monitoring:

volumes:
  pgdata:
  grafana-data:
